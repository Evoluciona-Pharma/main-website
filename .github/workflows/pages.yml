# Static export to GitHub Pages. Staging/production Docker deploys go through
# Jenkins (see docs/jenkins-deploy.md). Disable this workflow when Pages
# should no longer be the public site.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Supersede an in-flight run instead of letting it finish. Every commit is
# cumulative, so the newest run publishes everything the older one would have.
# Letting them queue is what jammed Pages: a run that gives up while its
# deployment is still open leaves that deployment held on the backend, and every
# later one is rejected with "due to in progress deployment". Cancelling the run
# lets deploy-pages' cleanup release the deployment it opened.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build static export
        run: npm run build:pages
        env:
          # The site is served from https://<org>.github.io/Site/
          NEXT_PUBLIC_BASE_PATH: /Site

      # Without this, Pages' Jekyll step drops the _next/ directory.
      - run: touch out/.nojekyll

      # enablement lets the first run turn Pages on itself, rather than
      # failing until someone flips it in repo settings.
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      # v4 started excluding dotfiles from the tarball, which would drop the
      # .nojekyll written above; include-hidden-files (v5) puts it back.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      # 600000ms is the hard maximum the action accepts — anything higher is
      # silently clamped, so raising it achieves nothing. One retry covers a
      # transient error; a held deployment needs the concurrency rule above.
      - id: deployment
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
